defaults:
    - override hydra/launcher: submitit_local

# environment
task: dog-run
obs: state
delta_actions: false # pusht: use delta (relative-displacement) actions instead of absolute pixel-target actions
delta_action_max: 50.0 # pusht: max pixel displacement per step when delta_actions is enabled
max_speed: null # pusht: if set (raw px/s), overrides delta_action_max with the calibrated equivalent steady-state actuator speed cap
velocity_penalty_alpha: 0.1

# evaluation
checkpoint: ???
eval_episodes: 1
eval_pi: true
eval_value: true # evaluate value function approximation
eval_freq: 50000
loss_eval_batches: 50 # number of batches to average prediction loss over (evaluate/eval_prediction_loss.py)
q_grid_size: 64 # resolution of the action-space grid used to visualize Q (evaluate/visualize_q_pusht.py)
q_return_type: "avg" # which Q reduction to visualize: min/avg/max (evaluate/visualize_q_pusht.py)
viz_every: 5 # save a Q-heatmap frame every N env steps (evaluate/visualize_q_pusht.py)
q_cmap: "turbo"

# training
steps: 2_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
data_dir: ???
exp_name: default

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
actor_mode: "residual"  #["residual", "awac", "sac", "bc_sac", "bc"]
log_std_min: -10
log_std_max: 2
prior_coef: 1.0
scale_threshold: 2.0
entropy_coef: 1e-4
awac_lambda: 0.3333
exp_adv_min: 0.1
exp_adv_max: 10.0

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: pusht
wandb_entity: tdmpc_square
wandb_silent: false
disable_wandb: true
save_csv: true

# misc
save_video: true
save_agent: true
save_agent_steps: [] # also save models/<step>.pt at these training steps, e.g. [150000]
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

# humanoid envs
policy_path: ???
mean_path: ???
var_path: ???
policy_type: ???
small_obs: ???
